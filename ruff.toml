# Retain Ruff's default rules; no previous repository Ruff settings exist.
include = ["scripts/**/*.py", "tests/**/*.py"]

[lint]
select = ["E4", "E7", "E9", "F", "N", "C901", "PLR0915"]

# Initial reviewable defaults, not externally mandated thresholds.
[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 50
