name: Python readability
on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/ruff.toml'
      - '**/.ruff.toml'
      - '**/pyproject.toml'
      - scripts/readability-baseline.json
      - .github/workflows/readability.yml
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/ruff.toml'
      - '**/.ruff.toml'
      - '**/pyproject.toml'
      - scripts/readability-baseline.json
      - .github/workflows/readability.yml
permissions:
  contents: read
jobs:
  readability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.10
      - name: Check synthetic ratchet behavior
        run: python scripts/check_readability.py --self-test
      - name: Check repository readability debt
        run: python scripts/check_readability.py --check
